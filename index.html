<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ランルート">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="距離・往復/片道・起伏を選ぶだけで、ランニングコースを自動で作るアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ランルート</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 地図が主役。下からせり上がるシート（PCでは左パネル）に設定と結果をまとめる */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface2:#f4f7f4; --ink:#16201c; --muted:#5d6a64; --line:#d6ddd8;
  --accent:#0f6b5c; --accent-ink:#ffffff; --route:#e2531f; --alt:#8a9993; --warn:#a85400; --shadow:0 -6px 24px rgba(16,32,28,.14);
  --font:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1513; --surface:#17201d; --surface2:#1e2925; --ink:#e7eeea; --muted:#9aa9a2; --line:#2c3a35;
  --accent:#3fb39d; --accent-ink:#0b1412; --route:#ff7a45; --alt:#6f807a; --warn:#f0a35a; --shadow:0 -6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.7)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));z-index:500;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 12px;
  font:900 15px/1 var(--font);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:6px;border-radius:3px;background:var(--route)}
.fab{position:fixed;z-index:500;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent);
  display:grid;place-items:center;cursor:pointer}
.fab svg{width:22px;height:22px}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:var(--shadow);max-height:62%;display:flex;flex-direction:column;transition:max-height .25s ease}
#sheet.collapsed{max-height:150px}
#grab{flex:none;height:22px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
#grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.body{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
@media (min-width:820px){
  #sheet{left:max(16px,env(safe-area-inset-left,0px));right:auto;top:76px;bottom:16px;width:380px;max-height:none;border-radius:16px}
  #sheet.collapsed{max-height:none}
  #grab{display:none}
  .body{padding-top:16px}
}

.goRow{display:flex;gap:10px;align-items:stretch}
.primary{flex:1;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font:900 17px/1 var(--font);letter-spacing:.04em;cursor:pointer}
.primary:disabled{opacity:.55;cursor:progress}
.summary{display:flex;flex-direction:column;justify-content:center;min-width:92px;padding:0 4px}
.summary b{font:600 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}

.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.group{display:flex;flex-direction:column;gap:8px}
.distTop{display:flex;align-items:baseline;justify-content:space-between}
.distVal{display:flex;align-items:baseline;gap:4px}
.distVal input{width:4.2em;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);
  font:600 30px/1.1 var(--mono);text-align:right;font-variant-numeric:tabular-nums;padding:0}
.distVal input:focus{outline:none;border-color:var(--accent)}
.distVal small{font:600 15px var(--mono);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:5px 12px;
  font:600 13px var(--mono);cursor:pointer}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--muted);border-radius:9px;padding:9px 4px;font:700 14px/1.2 var(--font);cursor:pointer}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.85}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.terrain button[data-v=flat][aria-pressed=true]{color:var(--accent)}
.terrain button[data-v=hilly][aria-pressed=true]{color:var(--route)}

.pt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:none;color:var(--ink);text-align:left;font:inherit;width:100%}
.pt[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pt .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);color:#fff}
.pt .dot.s{background:var(--accent)} .pt .dot.g{background:var(--route)}
.pt .txt{min-width:0;flex:1}
.pt .txt b{display:block;font-size:14px}
.pt .txt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:8px;padding:6px 10px;font:700 12px var(--font);cursor:pointer;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface2);color:var(--ink);font:500 14px var(--font)}
.hits{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hits button{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;padding:8px 10px;font:500 13px var(--font);cursor:pointer}
.hits button:last-child{border-bottom:0}
.paceRow{display:flex;align-items:center;gap:8px}
.paceRow input{width:4.5em;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface2);color:var(--ink);font:600 15px var(--mono);text-align:center}

#status{margin:0;font-size:13px;color:var(--muted);min-height:1.2em}
#status.err{color:var(--warn)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.card[aria-pressed=true]{border-color:var(--route);box-shadow:inset 0 0 0 1px var(--route)}
.card .no{grid-row:1/3;font:600 13px var(--mono);color:var(--muted)}
.card .km{font:600 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.card .km small{font-size:12px;color:var(--muted)}
.card .meta{grid-column:2/4;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font:700 11px var(--font);padding:3px 8px;border-radius:999px;border:1px solid currentColor;justify-self:end}
.tag.l0{color:var(--accent)} .tag.l1{color:var(--muted)} .tag.l2,.tag.l3{color:var(--route)}
.note{font-size:12px;color:var(--warn);margin:0}
#profileWrap{border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px}
#profile{display:block;width:100%;height:120px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions a,.actions button{display:grid;place-items:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:700 14px var(--font);text-decoration:none;cursor:pointer}
.km-mark{background:var(--surface);color:var(--ink);border:2px solid var(--route);border-radius:50%;width:22px!important;height:22px!important;
  display:grid;place-items:center;font:600 10px var(--mono);margin:-11px 0 0 -11px!important}
.pin{width:30px!important;height:30px!important;margin:-15px 0 0 -15px!important;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px var(--mono);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.s{background:var(--accent)} .pin.g{background:var(--route)}
.leaflet-control-attribution{font-size:10px}
@media (min-width:820px){.leaflet-bottom.leaflet-right{left:auto}}
@media (max-width:819px){.leaflet-bottom{bottom:150px}}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="地図"></div>
<div class="brand"><i></i>RUN ROUTE</div>
<button class="fab" id="locate" aria-label="現在地へ移動して出発地に設定">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<section id="sheet">
  <button id="grab" aria-label="パネルの開閉"></button>
  <div class="body">
    <div class="goRow">
      <button class="primary" id="go">ルートを作る</button>
      <div class="summary" id="summary"><b>—</b><span>未作成</span></div>
    </div>
    <p id="status"></p>

    <div id="results" hidden class="group">
      <div class="cards" id="cards"></div>
      <div id="profileWrap"><canvas id="profile"></canvas></div>
      <div class="actions">
        <button id="gpx">GPXを保存</button>
        <a id="gmap" target="_blank" rel="noopener">Googleマップで開く</a>
      </div>
    </div>

    <div class="group">
      <div class="distTop">
        <span class="lab">距離</span>
        <span class="distVal"><input id="distNum" type="number" inputmode="decimal" min="1" max="42.2" step="0.1" aria-label="距離（km）"><small>km</small></span>
      </div>
      <input id="distRange" type="range" min="1" max="42" step="0.5" aria-label="距離スライダー">
      <div class="chips" id="presets">
        <button class="chip" data-km="3">3</button><button class="chip" data-km="5">5</button>
        <button class="chip" data-km="10">10</button><button class="chip" data-km="15">15</button>
        <button class="chip" data-km="21.1">21.1</button><button class="chip" data-km="30">30</button>
      </div>
    </div>

    <div class="group">
      <span class="lab">コース</span>
      <div class="seg" id="modeSeg">
        <button data-v="loop">往復<small>現在地に戻る</small></button>
        <button data-v="oneway">片道<small>目的地へ向かう</small></button>
      </div>
    </div>

    <div class="group" id="points">
      <button class="pt" id="ptStart" data-pick="start">
        <span class="dot s">S</span><span class="txt"><b>スタート</b><span id="startTxt">未設定</span></span>
        <span class="mini" id="useHere">現在地</span>
      </button>
      <div id="goalBox" class="group">
        <button class="pt" id="ptGoal" data-pick="dest">
          <span class="dot g">G</span><span class="txt"><b>ゴール</b><span id="goalTxt">地図をタップするか検索</span></span>
        </button>
        <form class="search" id="searchForm">
          <input id="q" type="search" placeholder="目的地を検索（例：大濠公園）" aria-label="目的地を検索">
          <button class="mini" type="submit">検索</button>
        </form>
        <div class="hits" id="hits" hidden></div>
      </div>
      <p class="hint" id="pickHint">地図をタップするとスタート地点を変更できます</p>
    </div>

    <div class="group">
      <span class="lab">負荷（起伏）</span>
      <div class="seg terrain" id="terrainSeg">
        <button data-v="flat">フラット<small>坂を避ける</small></button>
        <button data-v="normal">おまかせ<small>距離優先</small></button>
        <button data-v="hilly">坂多め<small>脚づくり</small></button>
      </div>
    </div>

    <div class="paceRow">
      <span class="lab">想定ペース</span>
      <input id="pace" inputmode="numeric" aria-label="ペース（分:秒/km）"><span class="hint">/km</span>
    </div>
    <p class="hint">ルート：© OpenStreetMap / FOSSGIS　標高：Open-Meteo（Copernicus DEM）。道路状況や安全は現地で確認してください。</p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 状態 ---------- */
const S = { start:null, dest:null, startLabel:'', destLabel:'', mode:'loop', terrain:'normal', dist:5, pace:'6:00',
            pick:'start', results:[], sel:0, busy:false };
try { const s = JSON.parse(localStorage.getItem('runroute') || '{}');
  for (const k of ['mode','terrain','dist','pace']) if (s[k] != null) S[k] = s[k]; } catch (e) {}
const save = () => { try { localStorage.setItem('runroute', JSON.stringify({mode:S.mode,terrain:S.terrain,dist:S.dist,pace:S.pace})); } catch (e) {} };

/* ---------- 幾何 ---------- */
const R = 6371000, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function hav(a,b){ const dLa=rad(b.lat-a.lat), dLo=rad(b.lng-a.lng);
  const x=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(x))); }
function move(p,brg,d){ const δ=d/R, θ=rad(brg), φ1=rad(p.lat), λ1=rad(p.lng);
  const φ2=Math.asin(Math.sin(φ1)*Math.cos(δ)+Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
  const λ2=λ1+Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1),Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
  return {lat:deg(φ2), lng:deg(λ2)}; }
function bearing(a,b){ const φ1=rad(a.lat), φ2=rad(b.lat), Δ=rad(b.lng-a.lng);
  return (deg(Math.atan2(Math.sin(Δ)*Math.cos(φ2),Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δ)))+360)%360; }
function cumul(line){ const c=[0]; for(let i=1;i<line.length;i++) c.push(c[i-1]+hav(line[i-1],line[i])); return c; }
function resample(line,n){
  if (line.length<2) return line.map(p=>({...p,d:0}));
  const cum=cumul(line), total=cum[cum.length-1], out=[]; let j=0;
  for(let k=0;k<n;k++){ const t=total*k/(n-1);
    while(j<cum.length-2 && cum[j+1]<t) j++;
    const seg=(cum[j+1]-cum[j])||1, f=Math.min(1,Math.max(0,(t-cum[j])/seg));
    out.push({lat:line[j].lat+(line[j+1].lat-line[j].lat)*f, lng:line[j].lng+(line[j+1].lng-line[j].lng)*f, d:t}); }
  return out; }
/* 同じ道を2回通っている割合（折り返し・行き止まりの往復を減らすため） */
function overlap(line,total){
  const s=resample(line, Math.max(10,Math.ceil(total/20))), grid=new Map(), cell=0.0002; let dup=0;
  s.forEach((p,i)=>{ const gx=Math.floor(p.lng/cell), gy=Math.floor(p.lat/cell); let hit=false;
    for(let dx=-1;dx<=1&&!hit;dx++) for(let dy=-1;dy<=1&&!hit;dy++){ const a=grid.get((gx+dx)+','+(gy+dy));
      if(a) for(const j of a){ if(i-j>15 && hav(p,s[j])<18){hit=true;break;} } }
    if(hit) dup++; const key=gx+','+gy; (grid.get(key)||grid.set(key,[]).get(key)).push(i); });
  return dup/s.length; }

/* ---------- 外部API ---------- */
const routeCache = new Map();
async function route(pts){
  const c = pts.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
  if (routeCache.has(c)) return routeCache.get(c);
  const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${c}?overview=full&geometries=geojson`;
  let last;
  for (let i=0;i<3;i++){
    try{
      const r = await fetch(url);
      if (r.status===429 || r.status>=500){ last=new Error('HTTP '+r.status); await sleep(900*(i+1)); continue; }
      const j = await r.json();
      if (j.code!=='Ok' || !j.routes || !j.routes.length) throw new Error(j.code||'NoRoute');
      const rt = j.routes[0];
      const res = { dist: rt.distance, line: rt.geometry.coordinates.map(([lng,lat])=>({lat,lng})) };
      routeCache.set(c,res); return res;
    }catch(e){ last=e; if (e.message==='NoRoute'||e.message==='NoSegment') break; await sleep(500); }
  }
  throw last || new Error('route');
}
async function elevation(pts){
  const out=[];
  for (let i=0;i<pts.length;i+=100){
    const ch = pts.slice(i,i+100);
    const url = 'https://api.open-meteo.com/v1/elevation?latitude='+ch.map(p=>p.lat.toFixed(5)).join(',')+'&longitude='+ch.map(p=>p.lng.toFixed(5)).join(',');
    let ok=false;
    for (let t=0;t<3&&!ok;t++){
      try{ const r=await fetch(url); if(!r.ok) throw new Error(r.status); const j=await r.json(); out.push(...j.elevation); ok=true; }
      catch(e){ await sleep(600*(t+1)); }
    }
    if (!ok) return null;
  }
  return out;
}
async function pool(tasks,limit,onDone){
  const out=new Array(tasks.length); let i=0;
  await Promise.all(Array.from({length:limit}, async()=>{ while(i<tasks.length){ const k=i++;
    try{ out[k]=await tasks[k](); }catch(e){ out[k]=null; } onDone&&onDone(); } }));
  return out; }

/* 経由点の広がり h を調整して希望距離に寄せる */
async function tune(build,h0,D,base){
  let h=h0, best=null;
  for (let it=0; it<4; it++){
    const pts = build(h), res = await route(pts);
    const err = Math.abs(res.dist-D)/D;
    if (!best || err<best.err) best = {...res, err, wps:pts.slice(1,-1)};
    if (err<0.04) break;
    const got=res.dist-base, need=D-base;
    h *= Math.min(1.8, Math.max(0.55, got>1 ? need/got : 1.6));
  }
  return best;
}
function loopTask(start,D,heading,dir){
  return () => tune(r=>{
    const C = move(start,heading,r), pts=[start];
    for (let k=1;k<=3;k++) pts.push(move(C, heading+180+dir*k*90 + (Math.random()*16-8), r));
    pts.push(start); return pts;
  }, D/(2*Math.PI*1.3), D, 0);
}

/* ---------- 生成 ---------- */
async function generate(){
  if (S.busy) return;
  if (!S.start){ status('スタート地点を設定してください（現在地ボタンか地図をタップ）', true); return; }
  if (S.mode==='oneway' && !S.dest){ status('ゴールを地図タップか検索で設定してください', true); setPick('dest'); return; }
  const D = S.dist*1000;
  S.busy=true; $('#go').disabled=true; $('#go').textContent='探索中…';
  let notes=[];
  try{
    let tasks=[];
    const n = S.terrain==='normal' ? 6 : 8;
    const oneway = S.mode==='oneway' && hav(S.start,S.dest) > 250;
    if (!oneway){
      const base=Math.random()*360;
      for (let i=0;i<n;i++) tasks.push(loopTask(S.start,D,base+i*360/n, i%2?1:-1));
      if (S.mode==='oneway') notes.push('スタートとゴールが近いため周回ルートで作成しました');
    } else {
      status('直行ルートを確認中…');
      const direct = await route([S.start,S.dest]);
      if (direct.dist >= D*0.95){
        tasks=[async()=>({...direct, err:Math.abs(direct.dist-D)/D, wps:[]})];
        if (direct.dist > D*1.05) notes.push(`最短でも ${(direct.dist/1000).toFixed(1)} km あるため、最短ルートを表示しています`);
      } else {
        const L=hav(S.start,S.dest), f=Math.max(1.05,direct.dist/L), T=D/f, brg=bearing(S.start,S.dest);
        const along=t=>move(S.start,brg,L*t);
        const hArc = Math.sqrt(Math.max((T/2)**2-(L/2)**2,(L*0.15)**2));
        const hBox = Math.sqrt(Math.max(((T-0.7*L)/2)**2-(0.15*L)**2,1e4));
        for (const side of [1,-1]){
          const p=brg+90*side;
          tasks.push(()=>tune(h=>[S.start,move(along(.5),p,h),S.dest], hArc, D, direct.dist));
          tasks.push(()=>tune(h=>[S.start,move(along(.15),p,h),move(along(.85),p,h),S.dest], hBox, D, direct.dist));
          tasks.push(()=>tune(h=>[S.start,move(along(.3),p,h),S.dest], hArc, D, direct.dist));
          if (S.terrain!=='normal') tasks.push(()=>tune(h=>[S.start,move(along(.7),p,h),S.dest], hArc, D, direct.dist));
        }
      }
    }
    let done=0;
    status(`ルート候補を探索中 0/${tasks.length}`);
    const raw = (await pool(tasks,3,()=>status(`ルート候補を探索中 ${++done}/${tasks.length}`))).filter(Boolean);
    if (!raw.length) throw new Error('ルートが見つかりませんでした。地点を道路の近くに置き直してください');
    status('起伏を計算中…');
    // 似たルートを除外
    const uniq=[];
    for (const c of raw){ if(!uniq.some(u=>Math.abs(u.dist-c.dist)<60 && hav(u.line[Math.floor(u.line.length/2)],c.line[Math.floor(c.line.length/2)])<80)) uniq.push(c); }
    let elevOk=true;
    await pool(uniq.map(c=>async()=>{
      const n = Math.min(200,Math.max(30,Math.ceil(c.dist/60)));
      const s = resample(c.line,n), e = await elevation(s);
      c.overlap = overlap(c.line,c.dist);
      if (!e){ elevOk=false; c.gain=null; c.prof=null; return; }
      const sm = e.map((v,i)=>(e[Math.max(0,i-1)]+v+e[Math.min(e.length-1,i+1)])/3);
      let gain=0, loss=0; for(let i=1;i<sm.length;i++){ const d=sm[i]-sm[i-1]; if(d>0) gain+=d; else loss-=d; }
      c.gain=gain; c.loss=loss; c.prof={d:s.map(p=>p.d), e:sm};
    }),3);
    if (!elevOk) notes.push('一部の標高データを取得できず、起伏の評価が不完全です');
    for (const c of uniq){
      const gpk = c.gain==null ? 0 : c.gain/(c.dist/1000);
      c.gpk=gpk;
      let s = c.err*4 + c.overlap*1.2;
      if (S.terrain==='flat') s += gpk/15;
      if (S.terrain==='hilly') s -= Math.min(gpk,60)/15;
      c.score=s;
    }
    uniq.sort((a,b)=>a.score-b.score);
    S.results = uniq.slice(0,4); S.sel=0;
    if (S.terrain==='flat' && S.results[0].gpk>12) notes.push('周辺に平坦な道が少ないため、起伏が残っています');
    if (S.terrain==='hilly' && S.results[0].gpk<6) notes.push('周辺に坂が少なく、あまり起伏のあるルートになりませんでした');
    S.notes=notes;
    renderResults();
    status('');
    $('#sheet').classList.remove('collapsed');
    $('#results').scrollIntoView({block:'start',behavior:'smooth'});
  }catch(e){
    status((e && e.message && /[ぁ-ん]/.test(e.message)) ? e.message : '通信エラーでルートを作れませんでした。少し待って再度お試しください', true);
  }finally{
    S.busy=false; $('#go').disabled=false; $('#go').textContent= S.results.length ? 'ほかのルートを作る' : 'ルートを作る';
  }
}

/* ---------- 地図 ---------- */
const map = L.map('map',{zoomControl:false, attributionControl:true}).setView([33.5902,130.4017],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const pin = cls => L.divIcon({className:'pin '+cls, html:cls==='s'?'S':'G', iconSize:[30,30]});
let mStart=null, mGoal=null, layers=L.layerGroup().addTo(map);

function setStart(p,label){ S.start=p; S.startLabel=label||fmtLL(p);
  if(!mStart) mStart=L.marker(p,{icon:pin('s'),draggable:true}).addTo(map).on('dragend',e=>setStart(e.target.getLatLng(),'ドラッグで指定'));
  else mStart.setLatLng(p);
  $('#startTxt').textContent=S.startLabel;
  if (S.mode==='oneway' && !S.dest) setPick('dest'); }
function setDest(p,label){ S.dest=p; S.destLabel=label||fmtLL(p);
  if(!mGoal) mGoal=L.marker(p,{icon:pin('g'),draggable:true}).addTo(map).on('dragend',e=>setDest(e.target.getLatLng(),'ドラッグで指定'));
  else mGoal.setLatLng(p);
  mGoal.setOpacity(S.mode==='oneway'?1:0);
  $('#goalTxt').textContent=S.destLabel; }
const fmtLL = p => `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;
map.on('click', e=>{ const p={lat:e.latlng.lat,lng:e.latlng.lng};
  if (S.mode==='oneway' && S.pick==='dest') setDest(p,'地図で指定'); else setStart(p,'地図で指定'); });

function locate(){
  if (!navigator.geolocation){ status('この端末では位置情報を使えません。地図をタップしてください', true); return; }
  status('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    setStart(p,'現在地'); map.setView(p,15); status('');
  }, ()=>status('現在地を取得できませんでした。位置情報の許可を確認するか、地図をタップしてください', true),
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}

function drawRoutes(){
  layers.clearLayers();
  const css=getComputedStyle(document.documentElement);
  const cRoute=css.getPropertyValue('--route').trim(), cAlt=css.getPropertyValue('--alt').trim();
  S.results.forEach((c,i)=>{ if(i===S.sel) return;
    L.polyline(c.line,{color:cAlt,weight:4,opacity:.55,dashArray:'6 6'}).on('click',()=>select(i)).addTo(layers); });
  const c=S.results[S.sel]; if(!c) return;
  L.polyline(c.line,{color:'#fff',weight:9,opacity:.9}).addTo(layers);
  L.polyline(c.line,{color:cRoute,weight:5,opacity:1}).addTo(layers);
  const cum=cumul(c.line), every = c.dist>15000 ? 5000 : 1000;
  for (let k=every, j=0; k<c.dist-100; k+=every){
    while(j<cum.length-2 && cum[j+1]<k) j++;
    const f=(k-cum[j])/((cum[j+1]-cum[j])||1), a=c.line[j], b=c.line[j+1];
    L.marker({lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f},{interactive:false,
      icon:L.divIcon({className:'km-mark',html:String(k/1000)})}).addTo(layers);
  }
  const pad = window.innerWidth>=820 ? {paddingTopLeft:[420,40],paddingBottomRight:[40,40]} : {paddingTopLeft:[30,70],paddingBottomRight:[30,Math.round(window.innerHeight*0.6)]};
  map.fitBounds(L.latLngBounds(c.line), pad);
}

/* ---------- 表示 ---------- */
function status(t,err){ const el=$('#status'); el.textContent=t; el.classList.toggle('err',!!err); }
function paceSec(){ const m=String(S.pace).match(/^(\d{1,2}):(\d{2})$/); return m ? (+m[1])*60+(+m[2]) : 360; }
function hms(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; }
const LEVELS=[['フラット','l0'],['ゆるやか','l1'],['坂多め','l2'],['激坂','l3']];
const level = gpk => LEVELS[gpk<6?0:gpk<15?1:gpk<30?2:3];

function renderResults(){
  const box=$('#cards'); box.innerHTML='';
  S.results.forEach((c,i)=>{
    const [lv,cls]= c.gain==null ? ['不明','l1'] : level(c.gpk);
    const b=document.createElement('button'); b.className='card'; b.setAttribute('aria-pressed',i===S.sel);
    b.innerHTML=`<span class="no">#${i+1}</span><span class="km">${(c.dist/1000).toFixed(2)}<small> km</small></span>
      <span class="tag ${cls}">${lv}</span>
      <span class="meta">上り ${c.gain==null?'—':Math.round(c.gain)+' m'}・${hms(c.dist/1000*paceSec())}・重複 ${Math.round(c.overlap*100)}%</span>`;
    b.onclick=()=>select(i); box.appendChild(b);
  });
  (S.notes||[]).forEach(t=>{ const p=document.createElement('p'); p.className='note'; p.textContent=t; box.appendChild(p); });
  $('#results').hidden=false;
  select(S.sel);
}
function select(i){
  S.sel=i; const c=S.results[i];
  document.querySelectorAll('#cards .card').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));
  $('#summary').innerHTML=`<b>${(c.dist/1000).toFixed(2)}</b><span>km・${hms(c.dist/1000*paceSec())}</span>`;
  drawRoutes(); drawProfile(c); gmapLink(c);
}
function drawProfile(c){
  const cv=$('#profile'), wrap=$('#profileWrap');
  if(!c.prof){ wrap.hidden=true; return; } wrap.hidden=false;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||320, h=120;
  cv.width=w*dpr; cv.height=h*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const css=getComputedStyle(document.documentElement), col=v=>css.getPropertyValue(v).trim();
  const {d,e}=c.prof, total=d[d.length-1]||1;
  let lo=Math.min(...e), hi=Math.max(...e); if(hi-lo<20){ const m=(hi+lo)/2; lo=m-10; hi=m+10; }
  const L0=38,R0=8,T0=8,B0=20, X=v=>L0+(w-L0-R0)*v/total, Y=v=>T0+(h-T0-B0)*(1-(v-lo)/(hi-lo));
  g.strokeStyle=col('--line'); g.lineWidth=1;
  g.font='500 10px '+col('--mono'); g.fillStyle=col('--muted');
  [lo,(lo+hi)/2,hi].forEach(v=>{ g.beginPath(); g.moveTo(L0,Y(v)); g.lineTo(w-R0,Y(v)); g.stroke();
    g.textAlign='right'; g.textBaseline='middle'; g.fillText(Math.round(v)+'m',L0-4,Y(v)); });
  g.textAlign='center'; g.textBaseline='top';
  const km=total/1000, stepKm = km>20?5:km>8?2:1;
  for(let k=0;k<=km+1e-6;k+=stepKm) g.fillText(k+'km',Math.min(w-R0-10,Math.max(L0+8,X(k*1000))),h-B0+5);
  g.beginPath(); g.moveTo(X(0),Y(e[0])); d.forEach((x,i)=>g.lineTo(X(x),Y(e[i])));
  g.lineTo(X(total),h-B0); g.lineTo(X(0),h-B0); g.closePath();
  g.globalAlpha=.18; g.fillStyle=col('--route'); g.fill(); g.globalAlpha=1;
  g.beginPath(); d.forEach((x,i)=>i?g.lineTo(X(x),Y(e[i])):g.moveTo(X(x),Y(e[i])));
  g.strokeStyle=col('--route'); g.lineWidth=2; g.stroke();
}
function gmapLink(c){
  const ll=p=>p.lat.toFixed(6)+','+p.lng.toFixed(6), end = S.mode==='oneway'&&S.dest&&c.wps ? c.line[c.line.length-1] : S.start;
  const wp=(c.wps||[]).slice(0,3).map(ll).join('|');
  $('#gmap').href=`https://www.google.com/maps/dir/?api=1&origin=${ll(S.start)}&destination=${ll(end)}&travelmode=walking`+(wp?'&waypoints='+encodeURIComponent(wp):'');
}
function downloadGpx(){
  const c=S.results[S.sel]; if(!c) return;
  const name=`RUN ROUTE ${(c.dist/1000).toFixed(1)}km`;
  const x=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="RUN ROUTE" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>${name}</name><trkseg>\n`+
    c.line.map(p=>`<trkpt lat="${p.lat.toFixed(6)}" lon="${p.lng.toFixed(6)}"></trkpt>`).join('\n')+`\n</trkseg></trk>\n</gpx>\n`;
  const blob=new Blob([x],{type:'application/gpx+xml'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`runroute_${(c.dist/1000).toFixed(1)}km.gpx`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- 入力UI ---------- */
function setDist(v){ v=Math.min(42.2,Math.max(1,Math.round((+v||5)*10)/10)); S.dist=v;
  $('#distNum').value=v; $('#distRange').value=v; save(); }
function setSeg(id,v){ document.querySelectorAll(id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); }
function setMode(v){ S.mode=v; setSeg('#modeSeg',v); $('#goalBox').hidden = v!=='oneway';
  if (mGoal) mGoal.setOpacity(v==='oneway'?1:0);
  setPick(v==='oneway' && S.start && !S.dest ? 'dest' : 'start'); save(); }
function setPick(p){ S.pick=p;
  $('#ptStart').setAttribute('aria-pressed', S.mode==='oneway' && p==='start');
  $('#ptGoal').setAttribute('aria-pressed', p==='dest');
  $('#pickHint').textContent = S.mode!=='oneway' ? '地図をタップするとスタート地点を変更できます'
    : p==='dest' ? '地図をタップしてゴールを指定' : '地図をタップしてスタートを指定'; }

$('#distNum').addEventListener('change',e=>setDist(e.target.value));
$('#distRange').addEventListener('input',e=>setDist(e.target.value));
$('#presets').addEventListener('click',e=>{ const k=e.target.dataset.km; if(k) setDist(k); });
$('#modeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.v); });
$('#terrainSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ S.terrain=b.dataset.v; setSeg('#terrainSeg',S.terrain); save(); } });
$('#ptStart').addEventListener('click',e=>{ if(e.target.id==='useHere'){ locate(); return; } setPick('start'); });
$('#ptGoal').addEventListener('click',()=>setPick('dest'));
$('#locate').addEventListener('click',locate);
$('#go').addEventListener('click',generate);
$('#gpx').addEventListener('click',downloadGpx);
$('#grab').addEventListener('click',()=>$('#sheet').classList.toggle('collapsed'));
$('#pace').addEventListener('change',e=>{ const v=e.target.value.trim().replace('：',':');
  if(/^\d{1,2}:\d{2}$/.test(v)){ S.pace=v; save(); if(S.results.length) renderResults(); } else e.target.value=S.pace; });
$('#searchForm').addEventListener('submit',async e=>{
  e.preventDefault(); const q=$('#q').value.trim(); if(!q) return;
  const hits=$('#hits'); hits.hidden=false; hits.innerHTML='<button disabled>検索中…</button>';
  try{
    const c=map.getCenter();
    const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ja&q=${encodeURIComponent(q)}&viewbox=${c.lng-0.3},${c.lat+0.3},${c.lng+0.3},${c.lat-0.3}`;
    const j=await (await fetch(url)).json();
    hits.innerHTML='';
    if(!j.length){ hits.innerHTML='<button disabled>見つかりませんでした</button>'; return; }
    j.forEach(r=>{ const b=document.createElement('button'); b.textContent=r.display_name;
      b.onclick=()=>{ const p={lat:+r.lat,lng:+r.lon}; setDest(p,r.name||r.display_name.split(',')[0]); hits.hidden=true; setPick('start');
        map.fitBounds(L.latLngBounds([S.start||p,p]).pad(.3)); };
      hits.appendChild(b); });
  }catch(err){ hits.innerHTML='<button disabled>検索に失敗しました</button>'; }
});
window.addEventListener('resize',()=>{ const c=S.results[S.sel]; if(c) drawProfile(c); });

/* ---------- 起動 ---------- */
setDist(S.dist); setSeg('#terrainSeg',S.terrain); $('#pace').value=S.pace; setMode(S.mode);
locate();
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
